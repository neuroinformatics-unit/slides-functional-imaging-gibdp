meta:
  name:
    short: NIU
    full: Neuroinformatics Unit
  link:
    home: https://neuroinformatics.dev
    github: https://github.com/neuroinformatics-unit
    zulip: https://neuroinformatics.zulipchat.com

logo:
  medium: "img/logo_niu_light.png"

color:
  palette:
    white: "#FFFFFF"
    dark-grey: "#1E1E1E"
    niu-green: "#03A062"
    niu-green-dark: "#04B46D"
    bg-orange: "#EE9040"
    blue: "#4178f3"
    pm-blue: "#3574AE"
